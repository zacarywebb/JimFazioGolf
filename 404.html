<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jim Fazio Golf</title>
    <script>
      // GitHub Pages SPA fallback — stash the requested path and bounce to the app root
      sessionStorage.setItem('spa:redirect', location.pathname + location.search + location.hash);
      location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
    </script>
  </head>
  <body></body>
</html>
